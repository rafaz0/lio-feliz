# Quality Gates — Lio Feliz
#
# GitHub Actions é responsável APENAS pelos quality gates (lint, tests, build).
# O deploy oficial é feito pela integração GitHub ↔ Vercel.
# Consulte docs/DEPLOY.md para detalhes.

name: quality-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build
